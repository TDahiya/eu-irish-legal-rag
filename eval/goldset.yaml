# ----------------------------------------------------------------------- trap questions
# No answer exists in the corpus. The correct output is the abstention sentinel.
- q: What is the minimum salary threshold for an Irish EU Blue Card?
  expect_abstain: true
  kind: trap
  why: Ireland is not bound by the Blue Card Directive (Title V opt-out). There is no Irish Blue Card.
- q: What are Ireland's Schengen visa requirements?
  expect_abstain: true
  kind: trap
  why: Ireland is not in the Schengen area and issues no Schengen visas.
- q: Under the Single Permit Directive, how many days does Ireland have to decide an application?
  expect_abstain: true
  kind: trap
  why: Ireland is not bound by the Single Permit Directive.
- q: What does the Family Reunification Directive oblige Ireland to grant to a refugee's spouse?
  expect_abstain: true
  kind: trap
  why: Ireland is not bound by the Family Reunification Directive; Irish family reunification runs on national policy.
- q: What did the Irish High Court decide in Okonkwo v Minister for Justice [2025] IEHC 441?
  expect_abstain: true
  kind: trap
  why: A fabricated citation. The corpus contains no Irish High Court judgments.
- q: What does Article 150 of the EU AI Act provide?
  expect_abstain: true
  kind: trap
  why: The AI Act ends at Article 113. Article 150 does not exist.
- q: What does Article 99 of the AI Act say about Irish employment permits?
  expect_abstain: true
  kind: trap
  why: Article 99 concerns penalties and says nothing about employment permits. Conflates two instruments.
- q: What will the Critical Skills Occupations List salary threshold be in 2028?
  expect_abstain: true
  kind: trap
  why: A future figure that exists in no source.
- q: How do I apply for a United States H-1B visa from Ireland?
  expect_abstain: true
  kind: trap
  why: Entirely outside the corpus, which covers EU and Irish law only.
- q: Which section of the Data Protection Act 2018 sets the fee for an Irish work permit?
  expect_abstain: true
  kind: trap
  why: The Data Protection Act 2018 has nothing to do with work permit fees. A false premise about a real Act.
