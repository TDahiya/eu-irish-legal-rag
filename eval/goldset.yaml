# Evaluation questions.
#
# expect_instrument  substrings matched against a chunk's `instrument`. Relevance is
#                    judged at this level, not by chunk id, because chunk ids move
#                    whenever the chunker changes and the instrument does not.
# kind               citation | numeric | conceptual | multihop | trap
#                    The per-kind breakdown is the point: BM25 should win on
#                    `citation` and `numeric`, dense should win on `conceptual`.
# expect_abstain     true for questions the corpus cannot answer. Abstaining is the
#                    correct behaviour; inventing an answer is the failure being
#                    measured.

