# The corpus. Every source lives here; no module hardcodes a URL.
#
# ireland_bound matters: Ireland has a Title V (JHA) opt-out, so several EU immigration
# instruments do NOT apply here. Those become trap questions in eval/goldset.yaml —
# a system that quotes the Blue Card salary threshold "for Ireland" is hallucinating.
# Verify these flags with `python -m rag.fetch --dry-run` plus a human read.

crawl_delay:              # seconds between requests, per host
  publications.europa.eu: 1.0
  www.irishstatutebook.ie: 1.5   # 0.5s earned 397 HTTP 403s on a ~1900-item sweep; they throttle with 403, not 429
  www.irishimmigration.ie: 10.0   # their robots.txt asks for this
  enterprise.gov.ie: 2.0
  www.gutenberg.org: 2.0

