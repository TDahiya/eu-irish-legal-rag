# ------------------------------------------- Irish primary legislation (ELI XML, CC-BY 4.0)
ie_legislation:
  fetcher: eli
  items:
    # --- immigration ---
    - {eli: 2004/act/1,   domain: immigration, short: "Immigration Act 2004"}
    - {eli: 1999/act/22,  domain: immigration, short: "Immigration Act 1999"}
    - {eli: 2003/act/26,  domain: immigration, short: "Immigration Act 2003"}
    - {eli: 2015/act/66,  domain: immigration, short: "International Protection Act 2015"}
    - {eli: 1956/act/26,  domain: immigration, short: "Irish Nationality and Citizenship Act 1956"}
    - {eli: 1986/act/23,  domain: immigration, short: "Irish Nationality and Citizenship Act 1986"}
    - {eli: 2001/act/15,  domain: immigration, short: "Irish Nationality and Citizenship Act 2001"}
    - {eli: 2004/act/38,  domain: immigration, short: "Irish Nationality and Citizenship Act 2004"}
    - {eli: 1935/act/14,  domain: immigration, short: "Aliens Act 1935"}
    # --- employment permits ---
    - {eli: 2024/act/17,  domain: immigration, short: "Employment Permits Act 2024"}
    - {eli: 2006/act/16,  domain: immigration, short: "Employment Permits Act 2006"}
    - {eli: 2014/act/26,  domain: immigration, short: "Employment Permits (Amendment) Act 2014"}
    - {eli: 2015/si/548,  domain: immigration, short: "EC (Free Movement of Persons) Regulations 2015"}
    # --- tech / data ---
    - {eli: 2018/act/7,   domain: tech, short: "Data Protection Act 2018"}
    - {eli: 2011/act/3,   domain: tech, short: "Communications (Retention of Data) Act 2011"}
    - {eli: 2017/act/11,  domain: tech, short: "Criminal Justice (Offences Relating to Information Systems) Act 2017"}
    # --- general / rights ---
    - {eli: 2003/act/20,  domain: general, short: "European Convention on Human Rights Act 2003"}
    - {eli: 2000/act/8,   domain: general, short: "Equal Status Act 2000"}
    - {eli: 1998/act/21,  domain: general, short: "Employment Equality Act 1998"}
    # --- the Constitution (its own path, not an ELI act URI) ---
    - fetcher: url
      url: https://www.irishstatutebook.ie/eli/cons/en/html
      domain: general
      short: "Bunreacht na hEireann (Constitution of Ireland)"
    # --- bulk: Acts of the Oireachtas from 1996, filtered by subject.
    #     One request per year returns number + title for every Act of that year.
    #     Unfiltered this is 1,225 Acts and 67,501 chunks, 77% of the whole corpus,
    #     and the bulk of it is tax, company and planning law: Taxes Consolidation
    #     Act alone is 3,373 chunks. Those can only add noise to a question about a
    #     work permit or the AI Act. These keywords keep 442 instruments covering
    #     immigration, permits, data, equality and the justice system.
    - fetcher: isb_index
      kind: act
      years: [1996, 2026]
      domain: general
      include:
        ["immigration", "protection", "nationality", "citizen", "aliens", "refugee",
         "asylum", "visa", "employment permit", "work permit", "data protection",
         "communications", "information system", "equality", "equal status",
         "human rights", "criminal justice", "garda", "courts", "police", "judicial",
         "civil law", "free movement", "trafficking", "residence", "privacy",
         "electronic", "digital", "online", "artificial intelligence", "cyber",
         "broadcasting"]
    # --- bulk: statutory instruments, filtered by title. 760 SIs were made in 2024;
    #     these keywords keep the ~19 that touch immigration, permits or data.
    #     SI 444/2024 (Employment Permits Regulations) carries the occupation lists
    #     and salary thresholds, which is where the most useful answers live.
    - fetcher: isb_index
      kind: si
      years: [2000, 2026]
      domain: immigration
      include:
        [employment permit, immigration, international protection, nationality,
         citizen, data protection, aliens, free movement of persons, refugee,
         visa, asylum, carrier liability, safe countries, trafficking,
         habitual residence, atypical, work permit]

# ------------------------------------------------- Irish policy & guidance (HTML, robots-allowed)
ie_guidance:
  fetcher: sitemap
  items:
    - sitemap: https://www.irishimmigration.ie/page-sitemap.xml
      domain: immigration
      short: "Immigration Service Delivery guidance"
      # keep pages whose path contains any of these; drops press releases and site furniture
      include:
        [visa, permission, permit, residence, registration, citizenship, naturalisation,
         family, student, employment, work, stamp, immigration, protection, travel,
         appeal, fees, atypical, eu-treaty, reside]
      exclude: [news, press, gallery, contact-us, privacy, cookie, sitemap, feedback,
                "404", disclaimer, accessibility]
    # Employment permit eligibility lives with Enterprise, not Justice. These pages
    # carry the occupation lists that decide who can actually get a permit.
    - fetcher: url
      short: "Critical Skills Occupations List"
      domain: immigration
      url: https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/employment-permit-eligibility/highly-skilled-eligible-occupations-list/
    - fetcher: url
      short: "Ineligible List of Occupations for Employment Permits"
      domain: immigration
      url: https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/employment-permit-eligibility/ineligible-categories-of-employment/
    - fetcher: url
      short: "Employment Permit Eligibility"
      domain: immigration
      url: https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/employment-permit-eligibility/
    - fetcher: url
      short: "Critical Skills Employment Permit"
      domain: immigration
      url: https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/critical-skills-employment-permit/
    - fetcher: url
      short: "General Employment Permit"
      domain: immigration
      url: https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/
    - fetcher: url
      short: "Employment Permit Types"
      domain: immigration
      url: https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/

