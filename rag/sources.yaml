# The corpus. Every source lives here; no module hardcodes a URL.
#
# ireland_bound matters: Ireland has a Title V (JHA) opt-out, so several EU immigration
# instruments do NOT apply here. Those become trap questions in eval/goldset.yaml —
# a system that quotes the Blue Card salary threshold "for Ireland" is hallucinating.
# Verify these flags with `python -m rag.fetch --dry-run` plus a human read.

crawl_delay:              # seconds between requests, per host
  publications.europa.eu: 1.0
  www.irishstatutebook.ie: 1.0
  www.irishimmigration.ie: 10.0   # their robots.txt asks for this
  enterprise.gov.ie: 2.0
  www.gutenberg.org: 2.0

# ---------------------------------------------------------------- EU law (Cellar XHTML)
eu_law:
  fetcher: cellar
  items:
    # --- tech / AI / data ---
    - {celex: 32024R1689, domain: tech, ireland_bound: true,  short: "AI Act"}
    - {celex: 32016R0679, domain: tech, ireland_bound: true,  short: "GDPR"}
    - {celex: 32022R2065, domain: tech, ireland_bound: true,  short: "Digital Services Act"}
    - {celex: 32022R1925, domain: tech, ireland_bound: true,  short: "Digital Markets Act"}
    - {celex: 32023R2854, domain: tech, ireland_bound: true,  short: "Data Act"}
    - {celex: 32022L2555, domain: tech, ireland_bound: true,  short: "NIS2 Directive"}
    - {celex: 32024R2847, domain: tech, ireland_bound: true,  short: "Cyber Resilience Act"}
    - {celex: 32002L0058, domain: tech, ireland_bound: true,  short: "ePrivacy Directive"}
    - {celex: 32019L0790, domain: tech, ireland_bound: true,  short: "DSM Copyright Directive"}
    # --- immigration / free movement ---
    - {celex: 32004L0038, domain: immigration, ireland_bound: true,  short: "Free Movement Directive"}
    - {celex: 32013R0604, domain: immigration, ireland_bound: true,  short: "Dublin III Regulation"}
    - {celex: 32021L1883, domain: immigration, ireland_bound: false, short: "Blue Card Directive",
       note: "Ireland not bound — Title V opt-out. There is no Irish Blue Card."}
    - {celex: 32011L0098, domain: immigration, ireland_bound: false, short: "Single Permit Directive",
       note: "Ireland not bound — Title V opt-out."}
    - {celex: 32003L0086, domain: immigration, ireland_bound: false, short: "Family Reunification Directive",
       note: "Ireland not bound. Irish family reunification runs on national policy + INIS guidance."}
    - {celex: 32016R0399, domain: immigration, ireland_bound: false, short: "Schengen Borders Code",
       note: "Ireland is not in the Schengen area."}
    - {celex: 32011L0095, domain: immigration, ireland_bound: false, short: "Qualification Directive (recast)",
       note: "Ireland not bound by the recast."}
    - {celex: 32013L0032, domain: immigration, ireland_bound: false, short: "Asylum Procedures Directive (recast)",
       note: "Ireland not bound by the recast."}
    - {celex: 32009L0052, domain: immigration, ireland_bound: false, short: "Employer Sanctions Directive",
       note: "Ireland not bound."}
    # --- constitutional / rights ---
    - {celex: 12012P/TXT, domain: general, ireland_bound: true, short: "Charter of Fundamental Rights"}
    - {celex: 12016M/TXT, domain: general, ireland_bound: true, short: "Treaty on European Union"}
    - {celex: 12016E/TXT, domain: general, ireland_bound: true, short: "TFEU"}

