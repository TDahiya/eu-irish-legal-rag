# ------------------------------------------------- Irish policy & guidance (HTML, robots-allowed)
ie_guidance:
  fetcher: sitemap
  items:
    - sitemap: https://www.irishimmigration.ie/page-sitemap.xml
      domain: immigration
      short: "Immigration Service Delivery guidance"
      # keep pages whose path contains any of these; drops press releases and site furniture
      include:
        [visa, permission, permit, residence, registration, citizenship, naturalisation,
         family, student, employment, work, stamp, immigration, protection, travel,
         appeal, fees, atypical, eu-treaty, reside]
      exclude: [news, press, gallery, contact-us, privacy, cookie, sitemap, feedback,
                404, disclaimer, accessibility]

