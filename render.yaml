services:
  - type: web
    name: eu-irish-law-rag
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m rag.get_index
      python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"
    # Must bind the port Render hands it, on all interfaces. One worker: the
    # index and the ONNX model are ~300 MB resident and a second worker would
    # load its own copy straight past the 512 MB limit.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      # Set in the Render dashboard, not here.
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.14.3"
      # Keep the ONNX model inside the build so it is cached between deploys
      # rather than re-downloaded on every cold start.
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/.fastembed
