<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU &amp; Irish law — hybrid RAG</title>
<meta name="description" content="Hybrid retrieval over EU regulation, Acts of the Oireachtas, Irish immigration guidance and CJEU case law, with faithfulness measured on every answer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Set before first paint so the page never flashes the wrong theme.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark"
                       : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <span class="wordmark">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M9 1.5 L15.5 5 V9.5 C15.5 13 12.6 15.6 9 16.5 C5.4 15.6 2.5 13 2.5 9.5 V5 Z"
              fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M6 7.5 H12 M6 10.2 H10" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      EU &amp; Irish law
    </span>
    <span class="corpus-stat" id="corpus-stat"></span>
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9 1.2v2M9 14.8v2M1.2 9h2M14.8 9h2M3.5 3.5l1.4 1.4M13.1 13.1l1.4 1.4M14.5 3.5l-1.4 1.4M4.9 13.1l-1.4 1.4"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M15 11.3A6.6 6.6 0 0 1 6.7 3a6.8 6.8 0 1 0 8.3 8.3Z"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<main class="page">

  <div class="lede">
    <h1>What does the law actually say?</h1>
    <p>Hybrid retrieval over EU regulation, Acts of the Oireachtas, Irish immigration
       guidance and CJEU case law. Every answer carries its sources, and the system
       refuses when the corpus cannot support one.</p>
    <p class="disclaimer">A research aid, not legal advice.</p>
  </div>

  <form class="composer" id="composer">
    <label class="sr-only" for="q">Your question</label>
    <textarea id="q" rows="2" placeholder="Can the spouse of a Critical Skills Employment Permit holder work in Ireland?"></textarea>
    <div class="composer-foot">
      <div class="seg" role="group" aria-label="Retrieval mode">
        <button type="button" data-mode="agentic" aria-pressed="true">Agentic</button>
        <button type="button" data-mode="oneshot" aria-pressed="false">One-shot</button>
      </div>
      <div class="seg" role="group" aria-label="Fusion">
        <button type="button" data-fusion="hybrid" aria-pressed="true">Hybrid</button>
        <button type="button" data-fusion="bm25" aria-pressed="false">Lexical</button>
        <button type="button" data-fusion="dense" aria-pressed="false">Semantic</button>
      </div>
      <button class="btn btn-primary" type="submit" id="ask">Ask</button>
    </div>
  </form>

  <div class="settings" id="types" role="group" aria-label="Sources to search"></div>

  <div class="examples" id="examples"></div>

  <div id="out" aria-live="polite"></div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
